<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display - Live Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
            font-size: 1.1em;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            position: relative;
        }

        #display {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: black;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-top: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator.connected {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-indicator.disconnected {
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: none;
        }

        .status-indicator.connecting {
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .stat-label {
            opacity: 0.7;
        }

        .stat-value {
            font-weight: bold;
            margin-left: 5px;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .container {
                padding: 20px;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❤️ Heart Display</h1>
        <p class="subtitle">Live Raspberry Pi LED Matrix Stream</p>
        
        <div class="canvas-container">
            <canvas id="display" width="64" height="64"></canvas>
        </div>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator disconnected" id="statusIndicator"></div>
                <span id="statusText">Connecting...</span>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">FPS:</span>
                    <span class="stat-value" id="fpsValue">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Latency:</span>
                    <span class="stat-value" id="latencyValue">--</span>
                </div>
            </div>
        </div>
        
        <div class="info">
            Streaming live from your Raspberry Pi. Auto-reconnects on disconnect.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d', { alpha: false });
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const fpsValue = document.getElementById('fpsValue');
        const latencyValue = document.getElementById('latencyValue');

        // Scale canvas for better visibility
        const scale = Math.min(window.innerWidth / 64, window.innerHeight / 64, 8);
        canvas.style.width = `${64 * scale}px`;
        canvas.style.height = `${64 * scale}px`;

        let ws = null;
        let reconnectTimeout = null;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();
        let lastFrameTime = Date.now();

        function updateStatus(status, text) {
            statusIndicator.className = `status-indicator ${status}`;
            statusText.textContent = text;
        }

        function connectWebSocket() {
            // Clear any existing reconnect timeout
            if (reconnectTimeout) {
                clearTimeout(reconnectTimeout);
                reconnectTimeout = null;
            }

            // Construct WebSocket URL
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            updateStatus('connecting', 'Connecting...');

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus('connected', 'Connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'frame') {
                        // Decode base64 JPEG
                        const img = new Image();
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, 64, 64);
                            
                            // Update FPS counter
                            frameCount++;
                            const now = Date.now();
                            
                            // Update latency
                            const latency = now - lastFrameTime;
                            latencyValue.textContent = `${latency}ms`;
                            lastFrameTime = now;
                            
                            // Calculate FPS every second
                            if (now - lastFpsUpdate >= 1000) {
                                const fps = Math.round(frameCount * 1000 / (now - lastFpsUpdate));
                                fpsValue.textContent = fps;
                                frameCount = 0;
                                lastFpsUpdate = now;
                            }
                        };
                        img.src = 'data:image/jpeg;base64,' + data.data;
                    }
                } catch (err) {
                    console.error('Error processing message:', err);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('disconnected', 'Connection error');
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                updateStatus('disconnected', 'Disconnected');
                fpsValue.textContent = '0';
                latencyValue.textContent = '--';
                
                // Attempt to reconnect after 2 seconds
                reconnectTimeout = setTimeout(() => {
                    console.log('Attempting to reconnect...');
                    connectWebSocket();
                }, 2000);
            };
        }

        // Initial connection
        connectWebSocket();

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden, close connection to save resources
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            } else {
                // Page is visible, reconnect if needed
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    connectWebSocket();
                }
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            const scale = Math.min(window.innerWidth / 64, window.innerHeight / 64, 8);
            canvas.style.width = `${64 * scale}px`;
            canvas.style.height = `${64 * scale}px`;
        });
    </script>
</body>
</html>
