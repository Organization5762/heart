<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 1400px; width: 100%; }
        .canvas-container {
            background: #000;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            border: 2px solid #222;
        }
        #display {
            border-radius: 4px;
            image-rendering: pixelated;
        }
        .info-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .info-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
        }
        .info-card h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .info-card .value {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.connected {
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }
        .status-indicator.disconnected { background: #ef4444; }
        .device-list { list-style: none; margin-top: 8px; }
        .device-list li {
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .device-list li:last-child { border-bottom: none; }
        .device-name { flex: 1; }
        .device-type { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <canvas id="display" width="256" height="64"></canvas>
        </div>
        
        <div class="info-bar">
            <div class="info-card">
                <h3>Connection</h3>
                <div class="value">
                    <span class="status-indicator disconnected" id="status"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
            
            <div class="info-card">
                <h3>FPS</h3>
                <div class="value" id="fps">0</div>
            </div>
            
            <div class="info-card">
                <h3>Connected Devices</h3>
                <ul class="device-list" id="connected"><li><span class="device-type">None</span></li></ul>
            </div>
            
            <div class="info-card">
                <h3>Available Devices</h3>
                <ul class="device-list" id="available"><li><span class="device-type">Scanning...</span></li></ul>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script>
        const canvas = document.getElementById('display');
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const fpsValue = document.getElementById('fps');
        const connectedList = document.getElementById('connected');
        const availableList = document.getElementById('available');

        // Scale canvas
        const scale = Math.min((window.innerWidth - 100) / 256, 4);
        canvas.style.width = `${256 * scale}px`;
        canvas.style.height = `${64 * scale}px`;

        let renderer = null;
        let ws = null;
        let frameCount = 0;
        let lastFps = Date.now();
        const pressedKeys = new Set();

        async function init() {
            // Initialize WASM WebGL renderer
            const Module = await createRendererModule();
            renderer = Module;
            
            // Initialize WebGL renderer (all in C!)
            // Emscripten needs CSS selector format
            const success = renderer.cwrap('init_renderer', 'number', ['string', 'number', 'number'])('#display', 256, 64);
            if (!success) {
                console.error('Failed to initialize renderer');
                return;
            }
            
            // Get JPEG buffer pointer
            renderer.jpegPtr = renderer.cwrap('get_jpeg_buffer', 'number', [])();
            console.log('✓ WebGL renderer ready (100% C/WASM)');
            
            connectWebSocket();
        }

        function connectWebSocket() {
            const url = `ws://${location.host}/ws`;
            ws = new WebSocket(url);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                status.className = 'status-indicator connected';
                statusText.textContent = 'Connected';
            };

            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    // Frame: Copy JPEG to WASM and render
                    const bytes = new Uint8Array(event.data);
                    renderer.HEAPU8.set(bytes, renderer.jpegPtr);
                    renderer.cwrap('decode_and_render', 'number', ['number'])(bytes.length);
                    
                    // Update FPS
                    frameCount++;
                    const now = Date.now();
                    if (now - lastFps >= 1000) {
                        fpsValue.textContent = Math.round(frameCount * 1000 / (now - lastFps));
                        frameCount = 0;
                        lastFps = now;
                    }
                } else {
                    // Status update
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') {
                        updateDevices(data);
                    }
                }
            };

            ws.onerror = () => {
                status.className = 'status-indicator disconnected';
                statusText.textContent = 'Disconnected';
            };

            ws.onclose = () => {
                status.className = 'status-indicator disconnected';
                statusText.textContent = 'Disconnected';
                setTimeout(connectWebSocket, 2000);
            };
        }

        function updateDevices(data) {
            const conn = data.connected || [];
            connectedList.innerHTML = conn.length ? conn.map(d => 
                `<li><span class="status-indicator connected"></span><span class="device-name">${d.name}</span><span class="device-type">${d.type}</span></li>`
            ).join('') : '<li><span class="device-type">None</span></li>';
            
            const avail = data.available || [];
            availableList.innerHTML = avail.length ? avail.map(d => 
                `<li><span class="device-name">${d.name}</span><span class="device-type">${d.address}</span></li>`
            ).join('') : '<li><span class="device-type">Scanning...</span></li>';
        }

        function sendInput(type, data) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, ...data }));
            }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (!pressedKeys.has(e.code)) {
                pressedKeys.add(e.code);
                sendInput('keydown', { key: e.key, code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey });
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', e => {
            pressedKeys.delete(e.code);
            sendInput('keyup', { key: e.key, code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey });
            e.preventDefault();
        });

        // Mouse
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * 256);
            const y = Math.floor((e.clientY - rect.top) / rect.height * 64);
            sendInput('mousedown', { button: e.button, x, y });
            e.preventDefault();
        });

        canvas.addEventListener('mouseup', e => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / rect.width * 256);
            const y = Math.floor((e.clientY - rect.top) / rect.height * 64);
            sendInput('mouseup', { button: e.button, x, y });
            e.preventDefault();
        });

        canvas.addEventListener('wheel', e => {
            sendInput('mousewheel', { deltaX: e.deltaX, deltaY: e.deltaY });
            e.preventDefault();
        });

        canvas.tabIndex = 0;
        canvas.style.outline = 'none';

        // Start
        init();
    </script>
</body>
</html>
